<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">PASS IT ON community clothing initiative</title>
  <desc id="desc">Social initiative website project banner</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3F1D2E"/>
      <stop offset=".55" stop-color="#9F3D4F"/>
      <stop offset="1" stop-color="#B76E3C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#FCA5A5"/></linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#FFFFFF" opacity=".05"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1F0A14" flood-opacity=".42"/></filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#dots)"/>
  <circle cx="1080" cy="35" r="210" fill="#FDE68A" opacity=".045"/>
  <circle cx="1040" cy="360" r="240" fill="#FCA5A5" opacity=".04"/>

  <g transform="translate(80 77)">

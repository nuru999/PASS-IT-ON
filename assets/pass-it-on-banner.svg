    <path d="M66 106S24 82 24 51c0-17 21-25 42-5 21-20 42-12 42 5 0 31-42 55-42 55Z" fill="url(#accent)"/>
    <path d="M51 61c8-8 22-8 30 0" fill="none" stroke="#7F1D1D" stroke-width="5" stroke-linecap="round" opacity=".65"/>
  </g>

  <text x="246" y="109" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#FDE68A">COMMUNITY INITIATIVE</text>
  <text x="246" y="169" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="800" fill="#FFFFFF">PASS IT ON</text>
  <text x="246" y="213" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" fill="#FFF1F2">Wear kindness. Restore dignity. Strengthen communities.</text>

  <g transform="translate(246 255)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#FFF7ED">
    <rect width="126" height="40" rx="20" fill="#FFFFFF" opacity=".1"/><circle cx="23" cy="20" r="5" fill="#FDE68A"/><text x="39" y="26">Responsive</text>
    <g transform="translate(138)"><rect width="112" height="40" rx="20" fill="#FFFFFF" opacity=".1"/><circle cx="23" cy="20" r="5" fill="#FCA5A5"/><text x="39" y="26">Impact</text></g>
    <g transform="translate(262)"><rect width="130" height="40" rx="20" fill="#FFFFFF" opacity=".1"/><circle cx="23" cy="20" r="5" fill="#FED7AA"/><text x="39" y="26">Community</text></g>
  </g>

  <g transform="translate(918 86)" filter="url(#shadow)">
    <rect width="210" height="202" rx="24" fill="#401C2A" stroke="#FDE68A" stroke-opacity=".3"/>
    <path d="M105 158S48 127 48 83c0-25 29-36 57-9 28-27 57-16 57 9 0 44-57 75-57 75Z" fill="none" stroke="url(#accent)" stroke-width="8"/>
